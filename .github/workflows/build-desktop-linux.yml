name: Build Desktop (Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Build app bundles
        env:
          STANOK_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: npx tauri build --bundles deb,rpm

      - name: Validate runtime modules inside RPM
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "VALIDATION ERROR: $1"
            exit 1
          }

          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM not found after build"
            find src-tauri/target/release/bundle -maxdepth 6 -type f | sed -n '1,300p'
            fail "RPM file not found"
          fi

          RPM_ABS="$(realpath "${RPM_FILE}")"
          echo "Inspecting RPM manifest: ${RPM_ABS}"
          RPM_LIST="$(rpm -qlp "${RPM_ABS}" | sed 's#^\./#/#')"
          if [ -z "${RPM_LIST}" ]; then
            fail "Failed to read RPM file list"
          fi

          has_path() {
            grep -Fqx "$1" <<< "${RPM_LIST}"
          }

          assert_any_path() {
            local label="$1"
            shift
            for p in "$@"; do
              if has_path "$p"; then
                echo "${label}: found ${p}"
                return 0
              fi
            done
            echo "${label}: not found"
            printf '%s\n' "${RPM_LIST}" | sed -n '1,400p'
            fail "${label} missing in RPM"
          }

          assert_any_path "build-worker.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-worker.mjs"
          assert_any_path "build-css.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-css.mjs"
          assert_any_path "intcss package" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss/package.json"
          assert_any_path "sidecar node binary" \
            "/usr/bin/node" \
            "/usr/lib/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/Stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/binaries/node-x86_64-unknown-linux-gnu"

      - name: Smoke test installed RPM runtime
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "SMOKE ERROR: $1"
            exit 1
          }

          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          [ -n "${RPM_FILE}" ] || fail "RPM not found after build"
          RPM_ABS="$(realpath "${RPM_FILE}")"
          PKG_NAME="$(rpm -qp --queryformat '%{NAME}' "${RPM_ABS}" || true)"
          [ -n "${PKG_NAME}" ] || fail "Unable to detect RPM package name"

          sudo rpm -ivh --nosignature --nodeps "${RPM_ABS}" >/tmp/stanok-rpm-install.log 2>&1 \
            || { cat /tmp/stanok-rpm-install.log; fail "Failed to install RPM"; }

          APP_ROOT=""
          if [ -d /usr/lib/Stanok ]; then
            APP_ROOT="/usr/lib/Stanok"
          elif [ -d /usr/lib64/Stanok ]; then
            APP_ROOT="/usr/lib64/Stanok"
          else
            fail "Installed app root not found"
          fi

          test -f "${APP_ROOT}/runtime-node/scripts/build-worker.mjs" || fail "build-worker.mjs missing"
          test -f "${APP_ROOT}/runtime-node/scripts/build-css.mjs" || fail "build-css.mjs missing"
          test -d "${APP_ROOT}/runtime-node/node_modules/intcss" || fail "intcss missing"

          NODE_BIN=""
          for candidate in \
            "${APP_ROOT}/node-x86_64-unknown-linux-gnu" \
            "${APP_ROOT}/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/bin/node"; do
            if [ -x "${candidate}" ]; then
              NODE_BIN="${candidate}"
              break
            fi
          done
          [ -n "${NODE_BIN}" ] || fail "Node binary not found after install"
          echo "Smoke node binary: ${NODE_BIN}"
          "${NODE_BIN}" -v

          NODE_PATH="${APP_ROOT}/runtime-node/node_modules" \
            "${NODE_BIN}" --input-type=module -e "import { pathToFileURL } from 'node:url'; import(pathToFileURL(process.argv[1]).href).then(() => console.log('OK worker import')).catch((e) => { console.error(e); process.exit(1); });" \
            "${APP_ROOT}/runtime-node/scripts/build-worker.mjs" \
            || fail "Worker import failed on installed RPM"

          NODE_PATH="${APP_ROOT}/runtime-node/node_modules" \
            "${NODE_BIN}" --check "${APP_ROOT}/runtime-node/scripts/build-css.mjs" \
            || fail "build-css syntax check failed on installed RPM"

          sudo rpm -e "${PKG_NAME}" >/tmp/stanok-rpm-remove.log 2>&1 || {
            cat /tmp/stanok-rpm-remove.log
            fail "Failed to remove RPM package after smoke"
          }

      - name: Validate runtime modules inside DEB
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "VALIDATION ERROR: $1"
            exit 1
          }

          DEB_FILE="$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -n 1 || true)"
          [ -n "${DEB_FILE}" ] || fail "DEB file not found"
          DEB_ABS="$(realpath "${DEB_FILE}")"
          echo "Inspecting DEB manifest: ${DEB_ABS}"
          DEB_LIST="$(dpkg-deb -c "${DEB_ABS}" | awk '{print $6}' | sed -e 's#^\./#/#' -e 's#^usr/#/usr/#')"
          [ -n "${DEB_LIST}" ] || fail "Failed to read DEB file list"

          has_path() {
            local p="$1"
            grep -Fqx "$p" <<< "${DEB_LIST}" || grep -Fqx "${p#/}" <<< "${DEB_LIST}"
          }

          assert_any_path() {
            local label="$1"
            shift
            for p in "$@"; do
              if has_path "$p"; then
                echo "${label}: found ${p}"
                return 0
              fi
            done
            echo "${label}: not found"
            printf '%s\n' "${DEB_LIST}" | sed -n '1,400p'
            fail "${label} missing in DEB"
          }

          assert_any_path "build-worker.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib/stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib/Stanok/resources/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib/stanok/resources/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/Stanok/resources/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/stanok/resources/runtime-node/scripts/build-worker.mjs"
          assert_any_path "build-css.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib/stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib/Stanok/resources/runtime-node/scripts/build-css.mjs" \
            "/usr/lib/stanok/resources/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/Stanok/resources/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/stanok/resources/runtime-node/scripts/build-css.mjs"
          assert_any_path "intcss package" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib/stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib/stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib/Stanok/resources/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib/Stanok/resources/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib/stanok/resources/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib/stanok/resources/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/stanok/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib64/stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/Stanok/resources/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib64/Stanok/resources/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/stanok/resources/runtime-node/node_modules/intcss/index.js" \
            "/usr/lib64/stanok/resources/runtime-node/node_modules/intcss/package.json"
          assert_any_path "sidecar node binary" \
            "/usr/lib/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/Stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/Stanok/resources/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/Stanok/resources/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/stanok/resources/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/stanok/resources/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/resources/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/resources/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/stanok/resources/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/stanok/resources/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/bin/node"

      - name: Smoke test extracted DEB runtime
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "SMOKE ERROR: $1"
            exit 1
          }

          DEB_FILE="$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -n 1 || true)"
          [ -n "${DEB_FILE}" ] || fail "DEB file not found"
          DEB_ABS="$(realpath "${DEB_FILE}")"
          EXTRACT_DIR="$(mktemp -d)"
          dpkg-deb -x "${DEB_ABS}" "${EXTRACT_DIR}"

          APP_ROOT=""
          for candidate in \
            "${EXTRACT_DIR}/usr/lib/Stanok" \
            "${EXTRACT_DIR}/usr/lib/stanok" \
            "${EXTRACT_DIR}/usr/lib64/Stanok" \
            "${EXTRACT_DIR}/usr/lib64/stanok"; do
            if [ -d "${candidate}" ]; then
              APP_ROOT="${candidate}"
              break
            fi
          done
          [ -d "${APP_ROOT}" ] || fail "Extracted app root not found in DEB"
          RUNTIME_ROOT=""
          for candidate in \
            "${APP_ROOT}/runtime-node" \
            "${APP_ROOT}/resources/runtime-node"; do
            if [ -d "${candidate}" ]; then
              RUNTIME_ROOT="${candidate}"
              break
            fi
          done
          [ -n "${RUNTIME_ROOT}" ] || fail "runtime-node root not found in extracted DEB"

          test -f "${RUNTIME_ROOT}/scripts/build-worker.mjs" || fail "build-worker.mjs missing"
          test -f "${RUNTIME_ROOT}/scripts/build-css.mjs" || fail "build-css.mjs missing"
          test -d "${RUNTIME_ROOT}/node_modules/intcss" || fail "intcss missing"

          NODE_BIN=""
          for candidate in \
            "${APP_ROOT}/node-x86_64-unknown-linux-gnu" \
            "${APP_ROOT}/binaries/node-x86_64-unknown-linux-gnu" \
            "${APP_ROOT}/resources/node-x86_64-unknown-linux-gnu" \
            "${APP_ROOT}/resources/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/bin/node"; do
            if [ -f "${candidate}" ] || [ -x "${candidate}" ]; then
              NODE_BIN="${candidate}"
              break
            fi
          done
          if [ -z "${NODE_BIN}" ]; then
            NODE_BIN="$(command -v node || true)"
          fi
          [ -n "${NODE_BIN}" ] || fail "Node binary not found for DEB smoke"
          chmod +x "${NODE_BIN}" || true
          "${NODE_BIN}" -v

          NODE_PATH="${RUNTIME_ROOT}/node_modules" \
            "${NODE_BIN}" --input-type=module -e "import { pathToFileURL } from 'node:url'; import(pathToFileURL(process.argv[1]).href).then(() => console.log('OK worker import')).catch((e) => { console.error(e); process.exit(1); });" \
            "${RUNTIME_ROOT}/scripts/build-worker.mjs" \
            || fail "Worker import failed on extracted DEB"

          NODE_PATH="${RUNTIME_ROOT}/node_modules" \
            "${NODE_BIN}" --check "${RUNTIME_ROOT}/scripts/build-css.mjs" \
            || fail "build-css syntax check failed on extracted DEB"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanok-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Publish release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.deb
          fail_on_unmatched_files: true
