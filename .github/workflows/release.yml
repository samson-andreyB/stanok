name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: "true"
          npm_config_phantomjs_skip_download: "true"
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Build app bundles
        env:
          STANOK_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: npx tauri build --bundles deb,rpm

      - name: Validate sidecar/runtime in Linux packages
        shell: bash
        run: |
          set -euo pipefail

          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          [ -n "${RPM_FILE}" ] || { echo "RPM not found"; exit 1; }
          RPM_LIST="$(rpm -qlp "${RPM_FILE}" | sed 's#^\./#/#')"
          echo "${RPM_LIST}" | grep -Eq "^/usr/.*/runtime-node/scripts/build-css\\.mjs$|^/usr/lib/Stanok/runtime-node/scripts/build-css\\.mjs$|^/usr/lib64/Stanok/runtime-node/scripts/build-css\\.mjs$"
          echo "${RPM_LIST}" | grep -Eq "^/usr/bin/node$|^/usr/.*/node-x86_64-unknown-linux-gnu$|^/usr/.*/binaries/node-x86_64-unknown-linux-gnu$"

          DEB_FILE="$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -n 1 || true)"
          [ -n "${DEB_FILE}" ] || { echo "DEB not found"; exit 1; }
          DEB_LIST="$(dpkg-deb -c "${DEB_FILE}" | awk '{print $6}' | sed -e 's#^\./#/#' -e 's#^usr/#/usr/#')"
          echo "${DEB_LIST}" | grep -Eq "^/usr/.*/runtime-node/scripts/build-css\\.mjs$"
          echo "${DEB_LIST}" | grep -Eq "^/usr/bin/node$|^/usr/.*/node-x86_64-unknown-linux-gnu$|^/usr/.*/binaries/node-x86_64-unknown-linux-gnu$"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanok-linux-release
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: "true"
          npm_config_phantomjs_skip_download: "true"
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Prepare sidecar Node
        env:
          STANOK_TARGET_TRIPLE: ${{ matrix.target }}
        run: npm run prepare:sidecar-node

      - name: Validate prepared sidecar/runtime (macOS)
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="src-tauri/binaries/node-${{ matrix.target }}"
          test -f "${NODE_BIN}"
          test -f src-tauri/runtime-node/scripts/build-css.mjs
          test -d src-tauri/runtime-node/node_modules/intcss
          chmod +x "${NODE_BIN}"
          NODE_PATH="src-tauri/runtime-node/node_modules" "${NODE_BIN}" --check "src-tauri/runtime-node/scripts/build-css.mjs"

      - name: Build app bundles
        env:
          STANOK_TARGET_TRIPLE: ${{ matrix.target }}
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Validate sidecar/runtime in macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -type d -name '*.app' | head -n 1 || true)"
          [ -n "${APP_DIR}" ] || APP_DIR="$(find src-tauri/target/release/bundle/macos -type d -name '*.app' | head -n 1 || true)"
          [ -n "${APP_DIR}" ] || { echo "macOS .app bundle not found"; exit 1; }
          RES_DIR="${APP_DIR}/Contents/Resources"
          test -f "${RES_DIR}/runtime-node/scripts/build-css.mjs"
          test -d "${RES_DIR}/runtime-node/node_modules/intcss"
          MATCHES="$(find "${APP_DIR}/Contents" -type f \( -name "node-${{ matrix.target }}" -o -name "node" \) | sed '/^$/d' || true)"
          COUNT="$(printf '%s\n' "${MATCHES}" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "${COUNT}" -eq 1 ] || { echo "Expected exactly one sidecar node, got ${COUNT}"; printf '%s\n' "${MATCHES}"; exit 1; }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanok-macos-release
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: "true"
          npm_config_phantomjs_skip_download: "true"
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}\\.npm-cache
        run: npm ci

      - name: Prepare sidecar Node
        run: npm run prepare:sidecar-node

      - name: Validate prepared sidecar/runtime (Windows)
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          test -f "${NODE_BIN}"
          test -f src-tauri/runtime-node/scripts/build-css.mjs
          test -d src-tauri/runtime-node/node_modules/intcss
          NODE_PATH="src-tauri/runtime-node/node_modules" "${NODE_BIN}" --check "src-tauri/runtime-node/scripts/build-css.mjs"

      - name: Build app bundles
        env:
          STANOK_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanok-windows-release
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-macos
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stanok ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/**/*.rpm
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
          fail_on_unmatched_files: true
