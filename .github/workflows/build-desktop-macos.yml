name: Build Desktop (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Prepare sidecar Node
        env:
          STANOK_TARGET_TRIPLE: ${{ matrix.target }}
        run: npm run prepare:sidecar-node

      - name: Validate prepared runtime (macOS)
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/runtime-node/scripts/build-css.mjs
          test -d src-tauri/runtime-node/node_modules/intcss
          test -f "src-tauri/binaries/node-${{ matrix.target }}"
          NODE_BIN="src-tauri/binaries/node-${{ matrix.target }}"
          chmod +x "${NODE_BIN}"
          NODE_PATH="src-tauri/runtime-node/node_modules" \
            "${NODE_BIN}" --check "src-tauri/runtime-node/scripts/build-css.mjs"

      - name: Build app bundles
        env:
          STANOK_TARGET_TRIPLE: ${{ matrix.target }}
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Validate bundled runtime files (macOS)
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -type d -name '*.app' | head -n 1 || true)"
          [ -n "${APP_DIR}" ] || APP_DIR="$(find src-tauri/target/release/bundle/macos -type d -name '*.app' | head -n 1 || true)"
          [ -n "${APP_DIR}" ] || { echo "macOS .app bundle not found"; exit 1; }

          RES_DIR="${APP_DIR}/Contents/Resources"
          test -f "${RES_DIR}/runtime-node/scripts/build-css.mjs"
          test -d "${RES_DIR}/runtime-node/node_modules/intcss"

          MATCHES="$(find "${APP_DIR}/Contents" -type f \( -name "node-${{ matrix.target }}" -o -name "node" \) | sed '/^$/d' || true)"
          COUNT="$(printf '%s\n' "${MATCHES}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${COUNT}" -ne 1 ]; then
            echo "Expected exactly one sidecar node, got ${COUNT}"
            echo "Matches:"
            printf '%s\n' "${MATCHES}"
            echo "App bundle files (first 300):"
            find "${APP_DIR}/Contents" -maxdepth 5 -type f | sed -n '1,300p'
            exit 1
          fi
          SIDECAR="$(printf '%s\n' "${MATCHES}" | head -n 1)"
          chmod +x "${SIDECAR}"
          echo "Resolved sidecar: ${SIDECAR}"
          "${SIDECAR}" -v

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stanok-macos
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
