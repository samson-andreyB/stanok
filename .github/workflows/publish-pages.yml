name: Publish Plugin Audit Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-plugin-usage.mjs"
      - "test/style_pipeline/usage-audit/input/**"
      - "docs/plugin-audit/**"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: "true"
          npm_config_phantomjs_skip_download: "true"
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Build plugin audit page
        run: npm run audit:plugins:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/plugin-audit

  deploy-pages:
    runs-on: ubuntu-22.04
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
