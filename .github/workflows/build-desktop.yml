name: Build Desktop (Linux RPM)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'rpm'
            artifact_name: 'stanok-linux'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            rpm2cpio

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Validate runtime modules inside RPM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM not found after build"
            find src-tauri/target/release/bundle -maxdepth 6 -type f | sed -n '1,300p'
            exit 1
          fi

          AUDIT_DIR="$(mktemp -d)"
          RPM_ABS="$(realpath "${RPM_FILE}")"
          (cd "${AUDIT_DIR}" && rpm2cpio "${RPM_ABS}" | cpio -idm --quiet)

          APP_ROOT=""
          for candidate in \
            "${AUDIT_DIR}/usr/lib/Stanok" \
            "${AUDIT_DIR}/usr/lib64/Stanok"; do
            if [ -d "${candidate}" ]; then
              APP_ROOT="${candidate}"
              break
            fi
          done
          if [ -z "${APP_ROOT}" ]; then
            echo "Stanok app root not found inside RPM"
            find "${AUDIT_DIR}" -maxdepth 8 -type d | sed -n '1,300p'
            exit 1
          fi

          WORKER="${APP_ROOT}/runtime-node/scripts/build-worker.mjs"
          BUILD_CSS="${APP_ROOT}/runtime-node/scripts/build-css.mjs"
          INTCSS_PKG="${APP_ROOT}/runtime-node/node_modules/intcss/package.json"
          test -f "${WORKER}"
          test -f "${BUILD_CSS}"
          test -f "${INTCSS_PKG}"

          node --input-type=module -e "import { pathToFileURL } from 'node:url'; import(pathToFileURL(process.argv[1]).href).then(() => console.log('OK worker import')).catch((e) => { console.error(e); process.exit(1); });" "${WORKER}"
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; import(pathToFileURL(process.argv[1]).href).then(() => console.log('OK build-css import')).catch((e) => { console.error(e); process.exit(1); });" "${BUILD_CSS}"

      - name: Debug RPM contents
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM not found after build"
            find src-tauri/target/release/bundle -maxdepth 6 -type f | sed -n '1,300p'
            exit 1
          fi
          echo "Inspecting RPM: ${RPM_FILE}"
          rpm -qlp "${RPM_FILE}" | sed -n '1,400p'
          echo "Filtered runtime lines:"
          rpm -qlp "${RPM_FILE}" | grep -En "node-|/usr/bin/node|runtime-node/scripts|runtime-node/node_modules/intcss|/usr/bin/stanok" || true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
