name: Build Desktop (Windows + macOS + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'deb,rpm'
            artifact_name: 'stanok-linux'
          - os: windows-latest
            bundle: 'msi,nsis'
            artifact_name: 'stanok-windows'
          - os: macos-latest
            bundle: 'app,dmg'
            artifact_name: 'stanok-macos'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare bundled Node runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          NODE_RUNTIME_VERSION: '20.19.0'
        run: |
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          $url = "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION/node-v$env:NODE_RUNTIME_VERSION-win-$arch.zip"
          $work = Join-Path $env:RUNNER_TEMP "node-runtime"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $work "node.zip")
          Expand-Archive -Path (Join-Path $work "node.zip") -DestinationPath (Join-Path $work "extracted") -Force
          $nodeExe = Get-ChildItem -Path (Join-Path $work "extracted") -Filter node.exe -Recurse | Select-Object -First 1
          if (-not $nodeExe) { throw "node.exe was not found in downloaded archive" }
          New-Item -ItemType Directory -Force -Path "src-tauri/bundled-node" | Out-Null
          Copy-Item $nodeExe.FullName "src-tauri/bundled-node/node.exe" -Force

      - name: Prepare bundled Node runtime (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          NODE_RUNTIME_VERSION: '20.19.0'
        run: |
          set -euo pipefail
          arch="x64"
          if [[ "${{ runner.arch }}" == "ARM64" ]]; then
            arch="arm64"
          fi

          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            platform="linux-${arch}"
          else
            platform="darwin-${arch}"
          fi

          url="https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-${platform}.tar.gz"
          work="${RUNNER_TEMP}/node-runtime"
          mkdir -p "${work}" src-tauri/bundled-node
          curl -fsSL "${url}" -o "${work}/node.tgz"
          tar -xzf "${work}/node.tgz" -C "${work}"
          node_bin="$(find "${work}" -type f -path "*/bin/node" | head -n 1)"
          if [[ -z "${node_bin}" ]]; then
            echo "Failed to locate node binary in archive"
            exit 1
          fi
          cp "${node_bin}" src-tauri/bundled-node/node
          chmod +x src-tauri/bundled-node/node

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
