name: Build Desktop (Windows + macOS + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'deb,rpm'
            artifact_name: 'stanok-linux'
          - os: windows-latest
            bundle: 'msi,nsis'
            artifact_name: 'stanok-windows'
          - os: macos-latest
            bundle: 'app,dmg'
            artifact_name: 'stanok-macos'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare sidecar Node
        run: npm run prepare:sidecar-node

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Audit bundled runtime files (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$(find src-tauri/target/release/bundle -type d -name 'Stanok.AppDir' | head -n 1 || true)"
          if [ -z "${APPDIR}" ]; then
            echo "Stanok.AppDir not found"
            find src-tauri/target/release/bundle -maxdepth 4 -type d | sed -n '1,200p'
            exit 1
          fi

          echo "Inspecting AppDir: ${APPDIR}"
          test -f "${APPDIR}/usr/lib/Stanok/runtime-node/scripts/build-worker.mjs"
          test -f "${APPDIR}/usr/lib/Stanok/runtime-node/scripts/build-css.mjs"
          test -f "${APPDIR}/usr/lib/Stanok/runtime-node/linux-x64/node"
          test -d "${APPDIR}/usr/lib/Stanok/runtime-node/node_modules/intcss"

          SIDECAR_A="${APPDIR}/usr/lib/Stanok/node-x86_64-unknown-linux-gnu"
          SIDECAR_B="${APPDIR}/usr/lib/Stanok/binaries/node-x86_64-unknown-linux-gnu"
          if [ -f "${SIDECAR_A}" ]; then
            echo "Sidecar found at ${SIDECAR_A}"
          elif [ -f "${SIDECAR_B}" ]; then
            echo "Sidecar found at ${SIDECAR_B}"
          else
            echo "Sidecar not found in expected locations"
            find "${APPDIR}/usr/lib/Stanok" -maxdepth 3 -type f | sed -n '1,200p'
            exit 1
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
