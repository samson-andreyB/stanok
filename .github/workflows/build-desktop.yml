name: Build Desktop (Linux RPM)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'rpm'
            artifact_name: 'stanok-linux'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm2cpio

      - name: Prepare sidecar Node
        run: npm run prepare:sidecar-node

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Audit bundled runtime files (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM bundle not found"
            find src-tauri/target/release/bundle -maxdepth 8 -type f | sed -n '1,300p'
            exit 1
          fi

          echo "Inspecting RPM: ${RPM_FILE}"
          AUDIT_DIR="$(mktemp -d)"
          RPM_ABS="$(realpath "${RPM_FILE}")"
          if ! (cd "${AUDIT_DIR}" && rpm2cpio "${RPM_ABS}" | cpio -idm --quiet); then
            echo "Failed to extract RPM: ${RPM_ABS}"
            exit 1
          fi

          APP_ROOT=""
          for candidate in \
            "${AUDIT_DIR}/usr/lib/Stanok" \
            "${AUDIT_DIR}/usr/lib64/Stanok"; do
            if [ -d "${candidate}" ]; then
              APP_ROOT="${candidate}"
              break
            fi
          done

          if [ -z "${APP_ROOT}" ]; then
            echo "App root not found after RPM extract (checked: usr/lib and usr/lib64)"
            find "${AUDIT_DIR}" -maxdepth 8 -type d | sed -n '1,300p'
            find "${AUDIT_DIR}" -maxdepth 8 -type f | sed -n '1,300p'
            exit 1
          fi
          echo "Resolved app root: ${APP_ROOT}"

          test -f "${APP_ROOT}/runtime-node/scripts/build-worker.mjs"
          test -f "${APP_ROOT}/runtime-node/scripts/build-css.mjs"
          test -d "${APP_ROOT}/runtime-node/node_modules/intcss"

          RUNTIME_NODE_A="${APP_ROOT}/runtime-node/linux-x64/node"
          RUNTIME_NODE_B="${APP_ROOT}/runtime-node/node"

          SIDECAR_A="${APP_ROOT}/node-x86_64-unknown-linux-gnu"
          SIDECAR_B="${APP_ROOT}/binaries/node-x86_64-unknown-linux-gnu"

          NODE_FOUND=""
          if [ -f "${RUNTIME_NODE_A}" ]; then
            NODE_FOUND="${RUNTIME_NODE_A}"
          elif [ -f "${RUNTIME_NODE_B}" ]; then
            NODE_FOUND="${RUNTIME_NODE_B}"
          elif [ -f "${SIDECAR_A}" ]; then
            NODE_FOUND="${SIDECAR_A}"
          elif [ -f "${SIDECAR_B}" ]; then
            NODE_FOUND="${SIDECAR_B}"
          fi

          if [ -n "${NODE_FOUND}" ]; then
            echo "Node binary found at ${NODE_FOUND}"
          else
            echo "Node binary not found in expected locations under ${APP_ROOT}"
            find "${APP_ROOT}/runtime-node" -maxdepth 5 -type f | sed -n '1,300p'
            find "${APP_ROOT}" -maxdepth 4 -type f | sed -n '1,300p'
            exit 1
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
