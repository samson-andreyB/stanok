name: Build Desktop (Linux RPM)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'rpm'
            artifact_name: 'stanok-linux'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Prepare sidecar Node
        run: npm run prepare:sidecar-node

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Audit bundled runtime files (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM bundle not found"
            find src-tauri/target/release/bundle -maxdepth 8 -type f | sed -n '1,300p'
            exit 1
          fi

          echo "Inspecting RPM: ${RPM_FILE}"
          RPM_ABS="$(realpath "${RPM_FILE}")"
          RPM_LIST="$(rpm -qlp "${RPM_ABS}" | sed 's#^\./#/#')"
          if [ -z "${RPM_LIST}" ]; then
            echo "Failed to read RPM file list: ${RPM_ABS}"
            exit 1
          fi

          has_path() {
            printf '%s\n' "${RPM_LIST}" | grep -Fqx "$1"
          }

          assert_any() {
            local label="$1"
            shift
            for p in "$@"; do
              if has_path "$p"; then
                echo "${label}: found ${p}"
                return 0
              fi
            done
            echo "${label}: not found"
            printf '%s\n' "${RPM_LIST}" | sed -n '1,400p'
            exit 1
          }

          assert_any "build-worker.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-worker.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-worker.mjs"
          assert_any "build-css.mjs" \
            "/usr/lib/Stanok/runtime-node/scripts/build-css.mjs" \
            "/usr/lib64/Stanok/runtime-node/scripts/build-css.mjs"
          assert_any "intcss module dir marker" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss" \
            "/usr/lib/Stanok/runtime-node/node_modules/intcss/package.json" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss" \
            "/usr/lib64/Stanok/runtime-node/node_modules/intcss/package.json"
          assert_any "sidecar node binary" \
            "/usr/lib/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib/Stanok/binaries/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/node-x86_64-unknown-linux-gnu" \
            "/usr/lib64/Stanok/binaries/node-x86_64-unknown-linux-gnu"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
