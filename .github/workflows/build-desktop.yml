name: Build Desktop (Linux RPM)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: 'rpm'
            artifact_name: 'stanok-linux'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          check-latest: false

      - name: Verify Node Version
        run: node -v

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          PHANTOMJS_SKIP_DOWNLOAD: 'true'
          npm_config_phantomjs_skip_download: 'true'
          npm_config_tmp: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          npm_config_cache: ${{ runner.temp }}/.npm-cache
        run: npm ci

      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Prepare sidecar Node
        run: npm run prepare:sidecar-node

      - name: Verify prepared sidecar
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="src-tauri/binaries/node-x86_64-unknown-linux-gnu"
          if [ ! -f "${SIDECAR}" ]; then
            echo "Prepared sidecar missing: ${SIDECAR}"
            find src-tauri/binaries -maxdepth 2 -type f | sed -n '1,200p' || true
            exit 1
          fi
          echo "Prepared sidecar: ${SIDECAR}"
          "${SIDECAR}" -v

      - name: Build app bundles
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Debug RPM contents
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          RPM_FILE="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
          if [ -z "${RPM_FILE}" ]; then
            echo "RPM not found after build"
            find src-tauri/target/release/bundle -maxdepth 6 -type f | sed -n '1,300p'
            exit 1
          fi
          echo "Inspecting RPM: ${RPM_FILE}"
          rpm -qlp "${RPM_FILE}" | sed -n '1,400p'
          echo "Filtered runtime lines:"
          rpm -qlp "${RPM_FILE}" | rg -n "node-|runtime-node/scripts|runtime-node/node_modules/intcss|/usr/bin/stanok" -S || true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
